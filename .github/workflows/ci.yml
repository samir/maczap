name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # DESIGN §9: CI on macOS 15 and 26 (Apple Silicon runners).
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the toolchain, components and targets.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Contract test that launches an app
        run: cargo test -p maczap-core --test mac_platform -- --ignored
      - name: Build the Intel binary
        run: cargo build --release --target x86_64-apple-darwin -p maczap
