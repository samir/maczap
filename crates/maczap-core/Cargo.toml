[package]
name = "maczap-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Discovery, guard and quarantine engine of maczap, the safe macOS app uninstaller"
homepage = "https://github.com/samir/maczap"

[dependencies]
jiff = { version = "0.2.44", features = ["serde"] }
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-security = "0.3.2"
plist = "1.8.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints]
workspace = true

[package.metadata.dist]
dist = false
